  - name: libopenvino-intel-npu-plugin
    version: {{ version }}
    script: install/install_npu.sh
    about:
      summary: OpenVINO Intel® NPU plugin (driver compiler bundled)
      description: |
        OpenVINO plugin that schedules inference on the Intel NPU
        (libopenvino_intel_npu_plugin.so), plus the MLIR-based driver
        compiler (libopenvino_intel_npu_compiler.so) the plugin uses
        to lower OpenVINO IR to NPU blobs. The compiler is built from
        source from openvinotoolkit/npu_compiler (tag
        npu_ud_2026_12_1_rc1) as an OpenVINO extra module; its Intel
        LLVM/MLIR 20.x fork is compiled in-tree and statically linked
        into the library. Because it is built against the conda-forge
        sysroot it carries no glibc 2.34 floor.

        The userspace Level Zero driver (libze_intel_npu.so,
        packaged as intel-level-zero-npu) is required at runtime to
        actually enumerate NPU hardware.
      license: Apache-2.0 AND Apache-2.0-with-LLVM-exception
      license_file:
        - LICENSE
        - licensing/third-party-programs.txt
        - licensing/onednn_third-party-programs.txt
        - licensing/runtime-third-party-programs.txt
        # NPU compiler built from source (see source: + build.sh)
        - src/plugins/intel_npu/npu_compiler/LICENSE                          # [linux64]
        - src/plugins/intel_npu/npu_compiler/thirdparty/llvm-project/llvm/LICENSE.TXT  # [linux64]
    build:
      skip: true  # [not linux64]
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - cmake
        # needed for the from-source NPU compiler extra-module sub-build
        - ninja
        - ccache
        - lld
        - python  3.12
      host:
        - {{ pin_subpackage('libopenvino', exact=True) }}
        - pugixml
        - tbb-devel
        - level-zero-devel
        - level-zero >=1.28.4
        # the NPU compiler's in-tree LLVM links libz; run-export adds libzlib
        - zlib
      run:
        - {{ pin_subpackage('libopenvino', exact=True) }}
        # libze_loader.so.1 (RPATH=$ORIGIN) dlopens libze_intel_npu.so.1
        # from $CONDA_PREFIX/lib at runtime to actually reach NPU
        # hardware.  intel-level-zero-npu is only built on linux-64
        # (matching this output's skip selector).
        - intel-level-zero-npu
    test:
      commands:
        - test -f $PREFIX/lib/openvino-{{ version_postfix }}/libopenvino_intel_npu_plugin.so              # [linux64]
        - test -f $PREFIX/lib/openvino-{{ version_postfix }}/libopenvino_intel_npu_compiler.so            # [linux64]
        - if not exist %LIBRARY_BIN%\openvino-{{ version_postfix }}\openvino_intel_npu_plugin.dll exit 1  # [win]

