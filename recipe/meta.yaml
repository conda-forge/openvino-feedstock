{% set version_postfix = "2026.1.0" %}
{% set version = "2026.1.0" %}

package:
  name: openvino-split
  version: {{ version }}

source:
  - url: https://github.com/openvinotoolkit/openvino/archive/refs/tags/{{ version }}.tar.gz
    sha256: 8810fcf950c891ed4541e3fa1153f58cd8390a459a87e5fee509cd5ffe64e974
    patches:
      - patches/0001-Fix-compiling-Compute-Lib-with-scons-for-arm64.patch   # [aarch64]
      - patches/0002-don-t-prescribe-protobuf-major-version.patch
      - patches/0003-level_zero-compilation-condition.patch   # [win64 ]
  - url: https://github.com/ARM-software/ComputeLibrary/archive/refs/tags/v52.8.0.tar.gz  # [aarch64 or arm64]
    sha256: 1bceef23aa5b3cc7321cf80e0729e87482f12544b107cdabffb88a6a52aa4adc  # [aarch64 or arm64]
    folder: src/plugins/intel_cpu/thirdparty/ComputeLibrary  # [aarch64 or arm64]
  - url: https://github.com/openvinotoolkit/oneDNN/archive/6b6492b1ea9ef5ca9ff3c5c59ed71dcca683a446.tar.gz
    sha256: c12ff448213e873b0096d62a103447cf2686402d41a507d8cd4fcdac754ca5d1
    folder: src/plugins/intel_cpu/thirdparty/onednn
  - url: https://github.com/ARM-software/kleidiai/archive/7d82645ca2f3c3d58a5c0b1a96905e53916c8ff8.tar.gz
    sha256: 7f6dc8992d229d5a0be8c2dec09011bab7c45201ed06ae60fbcd3c9343d09368
    folder: src/plugins/intel_cpu/thirdparty/kleidiai
  - url: https://github.com/openvinotoolkit/mlas/archive/d1bc25ec4660cddd87804fcf03b2411b5dfb2e94.tar.gz
    sha256: 0a44fbfd4b13e8609d66ddac4b11a27c90c1074cde5244c91ad197901666004c
    folder: src/plugins/intel_cpu/thirdparty/mlas
  - url: https://github.com/uxlfoundation/oneDNN/archive/470e87eb07bdc805937a9f6d45d5c3a0fe4d27e7.tar.gz  # [win64 or linux64]
    sha256: 4181ad0fd5ddfe63084fce39a1cd4e0f3656f75e84f32e688e902b2d3a79b537  # [win64 or linux64]
    folder: src/plugins/intel_gpu/thirdparty/onednn_gpu  # [win64 or linux64]
  - url: https://github.com/intel/level-zero-npu-extensions/archive/42768cc73e74f6d371bd9dd51b1860b07774e7ec.tar.gz  # [linux64]
    sha256: 340b6c6757febfc55e5e707e2b5ab9d2cd0a526e82d921ee192c9ef5675bfe40  # [linux64]
    folder: src/plugins/intel_npu/thirdparty/level-zero-ext  # [linux64]
  # NPU driver compiler (the MLIR-based VPUX compiler) built from
  # source instead of bundling Intel's prebuilt vcl tarball (#162).
  # It is built as an OpenVINO extra module (see build.sh) and yields
  # libopenvino_intel_npu_compiler.so.  npu_compiler is vendored at
  # tag npu_ud_2026_12_1_rc1 together with its three submodules at the
  # exact commits recorded by that tag's git tree.  Plain GitHub
  # archive tarballs are used: verified that neither npu_compiler nor
  # npu-nn-cost-model store build-time blobs in git-lfs at these
  # commits, so the tarballs carry real content (no lfs smudge step).
  - url: https://github.com/openvinotoolkit/npu_compiler/archive/97d6545ee65327641e38707ad1f30479520d812c.tar.gz  # [linux64]
    sha256: e8801f45449c731d3b3fe38f264652c5824d3e48ebadeaddc37c53292c1f0ee4  # [linux64]
    folder: src/plugins/intel_npu/npu_compiler  # [linux64]
    patches:                                                                  # [linux64]
      - patches/0004-npu_compiler-undef-glibc-major-minor-macros.patch         # [linux64]
      - patches/0005-npu_compiler-dedup-Platform-constants-with-openvino.patch  # [linux64]
      - patches/0006-npu_compiler-drop-OptionMode-arg-from-Config-update.patch  # [linux64]
      - patches/0007-npu_compiler-fallback-commit-hash-for-archive-source.patch  # [linux64]
  # npu_compiler thirdparty/llvm-project submodule: Intel's LLVM/MLIR
  # 20.x fork (intel-staging/npu-compiler-llvm, branch npu/release/20.x).
  # Built in-tree and statically linked into the compiler .so.
  - url: https://github.com/intel-staging/npu-compiler-llvm/archive/cf3934f4e8ada928544a743481e037935a21e857.tar.gz  # [linux64]
    sha256: 0c4c304c51ed9b1de4e92733201597ea22d53516ca4044cacd5d063699debb28  # [linux64]
    folder: src/plugins/intel_npu/npu_compiler/thirdparty/llvm-project  # [linux64]
  # npu_compiler thirdparty/elf submodule (npu_plugin_elf).
  - url: https://github.com/openvinotoolkit/npu_plugin_elf/archive/82c444bcb9feb0f55fa33e18fbd711ec35426fba.tar.gz  # [linux64]
    sha256: 75ca714b84b5426ed2261e3ec798111f6dafde8d38f01351be0210021b689257  # [linux64]
    folder: src/plugins/intel_npu/npu_compiler/thirdparty/elf  # [linux64]
  # npu_compiler thirdparty/vpucostmodel submodule (npu-nn-cost-model).
  - url: https://github.com/intel/npu-nn-cost-model/archive/33ef9a69b4e694ad5bfc521af829a9cc9ce19b4c.tar.gz  # [linux64]
    sha256: cb4a0cce989763401a910ec6020b799ef56a9adec87df70bfec001678477a1b8  # [linux64]
    folder: src/plugins/intel_npu/npu_compiler/thirdparty/vpucostmodel  # [linux64]
  # OpenVINO's own thirdparty/flatbuffers and thirdparty/gtest git
  # submodules.  The feedstock's main (shared) build uses system
  # copies, but the static NPU compiler extra-module sub-build
  # (build.sh) builds flatbuffers in-tree -- npu_compiler's
  # thirdparty/flatbuffers.cmake reuses OpenVINO's in-tree `flatbuffers`
  # / `flatc` CMake targets, which only exist when
  # ENABLE_SYSTEM_FLATBUFFERS=OFF.  gtest is pulled by OpenVINO's
  # dependencies.cmake; vendor it so configure succeeds (it is
  # EXCLUDE_FROM_ALL and never actually compiled).  Submodule commits
  # read from `git ls-tree 2026.1.0 thirdparty/{flatbuffers,gtest}`.
  - url: https://github.com/google/flatbuffers/archive/595bf0007ab1929570c7671f091313c8fc20644e.tar.gz  # [linux64]
    sha256: 987300083ec1f1b095d5596ef8fb657ba46c45d786bc866a5e9029d7590a5e48  # [linux64]
    folder: thirdparty/flatbuffers/flatbuffers  # [linux64]
  - url: https://github.com/openvinotoolkit/googletest/archive/99760ac1776430f3df65947992bf4e8ebc0d7660.tar.gz  # [linux64]
    sha256: a2be20c53eade3fcea3f4258321c68cfb32af4835d97110c6aecbf67b10afe62  # [linux64]
    folder: thirdparty/gtest/gtest  # [linux64]
  - url: https://github.com/onnx/onnx/archive/refs/tags/v1.18.0.tar.gz
    sha256: b466af96fd8d9f485d1bb14f9bbdd2dfb8421bc5544583f014088fb941a1d21e
    folder: thirdparty/onnx/onnx

build:
  number: 5

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - ninja
    - pkg-config
    - scons  # [aarch64 or arm64]
    - cmake
    # only one python version during initial build
    - python  3.12
    - ccache
    # lld is used as the linker for the from-source NPU compiler
    # sub-build (linking the in-tree LLVM/MLIR fork).
    - lld  # [linux64]
    - libprotobuf
    - flatbuffers
  host:
    - tbb-devel
    - snappy
    - ocl-icd                       # [linux64]
    - clhpp                         # [linux64 or win64]
    - khronos-opencl-icd-loader     # [win64]
    - pugixml
    # Header only library, keep in sync with corresponded submodule version on release tag, i.e.
    # https://github.com/openvinotoolkit/openvino/tree/2025.4.0/thirdparty
    - xbyak  7.23.1                 # [x86_64]
    - libprotobuf
    # Keep in sync with corresponded submodule version on release tag, i.e.
    # https://github.com/openvinotoolkit/openvino/tree/2026.1.0/thirdparty/level_zero
    - level-zero-devel              # [linux64]
    - zlib
    - nlohmann_json

outputs:
  - name: libopenvino
    version: {{ version }}
    script: install/install.sh
    about:
      summary: OpenVINO Core Runtime library
      license: Apache-2.0
      license_file:
        - LICENSE
        - licensing/third-party-programs.txt
        - licensing/onednn_third-party-programs.txt
        - licensing/runtime-third-party-programs.txt
    build:
      run_exports:
        - {{ pin_subpackage('libopenvino', max_pin='x.x.x') }}
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - cmake
      host:
        - pugixml
        - tbb-devel
    test:
      commands:
        - test -f $PREFIX/lib/libopenvino.so.{{ version_postfix }}          # [linux]
        - test -f $PREFIX/lib/libopenvino_c.so.{{ version_postfix }}        # [linux]
        - test -f $PREFIX/lib/libopenvino.{{ version_postfix }}.dylib       # [osx]
        - test -f $PREFIX/lib/libopenvino_c.{{ version_postfix }}.dylib     # [osx]
        - if not exist %LIBRARY_BIN%\openvino.dll exit 1                    # [win]
        - if not exist %LIBRARY_BIN%\openvino_c.dll exit 1                  # [win]

